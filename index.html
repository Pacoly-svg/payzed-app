<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <script>
      // iPhone : plein écran (encoche et barre d'accueil gérées par env(safe-area-inset-*)),
      // sans zoom automatique quand on touche un champ (le zoom à deux doigts reste possible).
      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        document
          .querySelector('meta[name=viewport]')
          .setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover');
      }
    </script>
    <title>Payzed</title>
    <meta name="description" content="Payzed — banque mobile simple" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light only" />
    <meta name="format-detection" content="telephone=no" />
    <!-- iPhone : « Sur l'écran d'accueil » ouvre Payzed en plein écran, comme une app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Payzed" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
